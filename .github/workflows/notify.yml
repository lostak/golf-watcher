name: notify
# Relay for Claude's scheduled tasks (Slack is retired):
#   gh workflow run notify.yml -R lostak/golf-watcher --ref main -f channel=golf -f text="$(cat /tmp/msg.txt)"
# channel=golf → the Discord golf channel. Any other personal channel (general, powder, …) → Bradley's Discord DMs
# from the bot (never a shared channel). channel=none (work) → nowhere: work content never goes to Discord.
on:
  workflow_dispatch:
    inputs:
      text: { description: 'Message (*bold* becomes Discord bold; newlines allowed)', required: true, type: string }
      channel: { description: 'golf = golf channel | none = drop (work) | anything else = Bradley''s DMs', required: false, default: 'dm', type: string }
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TEXT: '${{ inputs.text }}'
          CHANNEL: '${{ inputs.channel }}'
          DISCORD_WEBHOOK_GOLF: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          CH: '${{ secrets.DISCORD_CHANNEL_ID }}'
        run: |
          node -e '
            const e = process.env, ch = (e.CHANNEL || "dm").toLowerCase(), one = v => String(v || "").split(/\s+/).filter(Boolean)[0] || "";
            const content = (e.TEXT || "").replace(/\*([^*\n]+)\*/g, "**$1**").slice(0, 1990);
            const api = async (m, p, b) => { const r = await fetch("https://discord.com/api/v10" + p, { method: m, headers: { Authorization: "Bot " + one(e.TOKEN), "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined }); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); };
            (async () => {
              if (ch === "none") return console.log("work message: not sent anywhere");
              if (ch === "golf") { const r = await fetch(e.DISCORD_WEBHOOK_GOLF, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content }) }); if (!r.ok) throw new Error("golf " + r.status); return console.log("golf: ok"); }
              const g = await api("GET", "/channels/" + one(e.CH)), owner = (await api("GET", "/guilds/" + g.guild_id)).owner_id;
              const dm = await api("POST", "/users/@me/channels", { recipient_id: owner });
              await api("POST", "/channels/" + dm.id + "/messages", { content, allowed_mentions: { parse: [] } });
              console.log("dm: ok");
            })().catch(x => { console.error(x.message); process.exit(1); });'
