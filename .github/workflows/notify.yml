name: notify
# Relay: anything (including Claude's scheduled tasks) can run this workflow to post a message to Bradley's
# Slack DM and a Discord channel. Secrets stay here. Usage:
#   gh workflow run notify.yml -R lostak/golf-watcher --ref main -f channel=golf -f text="$(cat /tmp/msg.txt)"
# channel=golf → DISCORD_WEBHOOK_URL (this repo's golf channel); anything else → DISCORD_WEBHOOK_GENERAL. Slack always gets it.
# Powder and game-price messages use the same relay in lostak/powder-report and lostak/game-price-watcher.
on:
  workflow_dispatch:
    inputs:
      text: { description: 'Message (Slack markdown: *bold*; newlines allowed)', required: true, type: string }
      channel: { description: 'golf | general', required: false, default: 'general', type: string }
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TEXT: '${{ inputs.text }}'
          CHANNEL: '${{ inputs.channel }}'
          SLACK: '${{ secrets.SLACK_WEBHOOK_URL }}'
          D_GOLF: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          D_GENERAL: '${{ secrets.DISCORD_WEBHOOK_GENERAL }}'
        run: |
          node -e '
            const e = process.env, text = e.TEXT || "";
            const discord = (e.CHANNEL || "general").toLowerCase() === "golf" ? e.D_GOLF : e.D_GENERAL;
            const post = async (url, body) => { if (!url) return "skipped"; const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return r.ok ? "ok" : "failed " + r.status; };
            (async () => {
              const s = await post(e.SLACK, { text });
              const d = await post(discord, { content: text.replace(/\*([^*\n]+)\*/g, "**$1**").slice(0, 1990) });
              console.log("channel:", e.CHANNEL, "slack:", s, "discord:", d);
              if (s.startsWith("failed") || d.startsWith("failed")) process.exit(1);
            })();'
