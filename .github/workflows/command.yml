name: command
# One command from outside Discord (Claude's Pocket processor runs this when Bradley says it into Pocket):
#   gh workflow run command.yml -R lostak/golf-watcher --ref main -f text="watch Sat 7-11 for 4 at Murphy Creek"
# Same grammar as the Discord channel; the answer is posted to Discord and Slack.
on:
  workflow_dispatch:
    inputs:
      text: { description: 'Command text', required: true, type: string }
concurrency: { group: golf-commands, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults: { run: { working-directory: golf-watcher } }
    steps:
      - uses: actions/checkout@v4
      - id: cmd
        env:
          TEXT: '${{ inputs.text }}'
          DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
        run: |
          set +e; node commands.js --text "$TEXT"; rc=$?; set -e
          [ "$rc" = "3" ] && echo "changed=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "4" ] && echo "report=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || [ "$rc" = "4" ]
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name golf-watcher && git config user.email golf-watcher@users.noreply.github.com
          git add wants.json && (git diff --cached --quiet || (git commit -m "command: wants updated" && git pull --rebase -q -X theirs && git push))
          if [ "${{ steps.cmd.outputs.changed }}" = "yes" ] || [ "${{ steps.cmd.outputs.report }}" = "yes" ]; then
            gh workflow enable golf-watch.yml -R "$GITHUB_REPOSITORY" || true
            gh workflow run golf-watch.yml -R "$GITHUB_REPOSITORY" --ref main
          fi
          [ "${{ steps.cmd.outputs.report }}" = "yes" ] && gh workflow run daily-report.yml -R "$GITHUB_REPOSITORY" --ref main || true
