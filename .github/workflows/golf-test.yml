name: golf tests
on:
  push:
    paths: ['golf-watcher/*.js', 'golf-watcher/wants.json', 'golf-watcher/test/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test test/
        working-directory: golf-watcher
