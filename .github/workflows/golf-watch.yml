name: golf-watch
on:
  schedule:
    # Every 5 minutes, 5 AM–10 PM Denver only (UTC hours below cover both MST and MDT; the gate trims the edges).
    - cron: '*/5 0-4,11-23 * * *'   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      dry: { description: 'Dry run (read only, no Slack, no state)', type: boolean, default: false }
      debug: { description: 'Verbose log', type: boolean, default: false }
concurrency: { group: golf-watch, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults: { run: { working-directory: golf-watcher } }
    steps:
      - uses: actions/checkout@v4
      - name: Gate (quiet hours, anything to watch?)
        id: gate
        env: { EVENT: '${{ github.event_name }}', GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}', GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}' }
        run: |
          h=$((10#$(TZ=America/Denver date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$h" -ge 22 ] || [ "$h" -lt 5 ]; }; then
            echo "Quiet hours (10 PM–5 AM) – skipping."; echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(node gate.js)
          if [ "$n" = "0" ] && [ "$EVENT" = "schedule" ]; then echo "No days wanted – nothing to do."; echo "run=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$n day(s) wanted."; echo "run=yes" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.gate.outputs.run == 'yes'
        run: npm install --no-audit --no-fund
      # No browser download: the runner's own Google Chrome is used (chromium.launch({ channel: 'chrome' })).
      - if: steps.gate.outputs.run == 'yes'
        run: node watch.js ${{ inputs.dry && '--dry' || '' }} ${{ inputs.debug && '--debug' || '' }}
        env: { SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}', DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}', GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}', GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}' }
      - name: Save seen list
        if: steps.gate.outputs.run == 'yes' && !inputs.dry
        run: |
          git config user.name golf-watcher && git config user.email golf-watcher@users.noreply.github.com
          git add state/seen.json && (git diff --cached --quiet || (git commit -m "golf watcher: update seen list" && git pull --rebase -q && git push))
