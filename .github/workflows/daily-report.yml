name: daily-report
# What's open today, tomorrow and this weekend. tick.yml starts it once a day after 7:15 AM (daily=true: skipped if
# today's already went out); "report" in Discord or "personal golf report" in Pocket starts it on demand.
on:
  workflow_dispatch:
    inputs:
      dry: { description: 'Dry run (print only)', type: boolean, default: false }
      daily: { description: 'Only if the report has not been posted yet today', type: boolean, default: false }
      debug: { description: 'Verbose log', type: boolean, default: false }
concurrency: { group: daily-report, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: golf-watcher } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node watch.js --report ${{ inputs.daily && '--daily' || '' }} ${{ inputs.dry && '--dry' || '' }} ${{ inputs.debug && '--debug' || '' }}
        env: { SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}', DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}', GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}', GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}' }
      - if: ${{ !inputs.dry }}
        run: |
          git config user.name golf-watcher && git config user.email golf-watcher@users.noreply.github.com
          git add state/ && (git diff --cached --quiet || (git commit -m "golf watcher: daily report" && git pull --rebase -q -X theirs && git push))
