name: discord-commands
# Every 5 minutes: read new messages in the Discord golf channel and turn them into wants.json changes
# ("watch Sat 7-11 for 4 at Murphy Creek", "stop Sat", "list"). Needs DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: { group: golf-commands, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults: { run: { working-directory: golf-watcher } }
    steps:
      - uses: actions/checkout@v4
      - id: cmd
        env:
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
          DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          set +e; node commands.js; rc=$?; set -e
          [ "$rc" = "3" ] && echo "changed=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "4" ] && echo "report=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || [ "$rc" = "4" ]
      - name: Save cursor / wants
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name golf-watcher && git config user.email golf-watcher@users.noreply.github.com
          git add state/discord.json wants.json && (git diff --cached --quiet || (git commit -m "discord: ${{ steps.cmd.outputs.changed == 'yes' && 'wants updated from Discord' || 'cursor' }}" && git pull --rebase -q && git push))
          if [ "${{ steps.cmd.outputs.changed }}" = "yes" ]; then
            gh workflow enable golf-watch.yml -R "$GITHUB_REPOSITORY" || true
            gh workflow run golf-watch.yml -R "$GITHUB_REPOSITORY" --ref main
          fi
          [ "${{ steps.cmd.outputs.report }}" = "yes" ] && gh workflow run daily-report.yml -R "$GITHUB_REPOSITORY" --ref main || true
