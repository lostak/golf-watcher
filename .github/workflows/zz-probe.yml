name: zz-probe (temporary)
on: { push: { branches: [claude/project-thread-s8rv6l], paths: ['.github/workflows/zz-probe.yml'] } }
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS -m 20 https://511.cotrip.org/configs/main.json -o main.json
          jq -c '.layers[] | {name, api, query, collection}' main.json
          curl -sS -m 25 -A 'powder-morning' 'https://api-511x-co.carsprogram.org/events?eventClassifications=roadClosures' -o ev.json -w "events %{http_code} %{size_download}\n"
          head -c 1500 ev.json; echo
          jq -c 'if type=="array" then (length, (.[0]|keys)) else keys end' ev.json || true
          jq -c '[.[] | select(tostring|test("I-70"))] | length' ev.json || true
          jq -c '[.[] | select(tostring|test("I-70"))][0]' ev.json | head -c 2500 || true
          curl -sS -m 25 'https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/stations?stationTriplets=415:CO:SNTL' -w "\nsnotel stations %{http_code}\n" | head -c 300
