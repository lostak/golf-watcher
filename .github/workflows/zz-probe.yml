name: zz-probe (temporary)
on: { push: { branches: [claude/project-thread-s8rv6l], paths: ['.github/workflows/zz-probe.yml'] } }
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          p() { echo "=== $1"; curl -sS -m 25 -A 'powder-morning (github.com/lostak/golf-watcher)' -H 'Accept: application/json' -o out -w "HTTP %{http_code} %{content_type} %{size_download}\n" "$1"; head -c ${2:-600} out; echo; }
          p "https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/data?stationTriplets=415:CO:SNTL&elements=SNWD&duration=HOURLY&beginDate=2026-11-16%2000:00&endDate=2026-11-17%2006:00&periodRef=END" 300
          p "https://wcc.sc.egov.usda.gov/reportGenerator/view_csv/customSingleStationReport/hourly/415:CO:SNTL%7Cid=%22%22%7Cname/-30,0/SNWD::value" 700
          p "https://511.cotrip.org/configs/main.json" 3000
          curl -sS -m 20 https://www.cotrip.org/assets/index-3AUZbUiL.js -o b.js
          grep -oE '"/[a-zA-Z0-9_]+_v[0-9]+/api/[^"]*"' b.js | sort -u | head -80
          grep -oE '.{60}graphql.{60}' b.js | head -5
          grep -oE '.{80}(travelTime|roadCondition|chainLaw|eventMapFeatures|mapFeatures).{80}' b.js | head -12
